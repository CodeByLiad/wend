name: Build and tests

on:
  push:
    branches: [main, feat/engine, feat/benchmark, feat/eval]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK and native build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - name: Build, test, lint and check formatting
        run: ./gradlew build test :core:engine:test lint spotlessCheck --no-daemon
      - name: Upload prototype benchmark APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wend-benchmark-debug
          path: tools/benchmark/build/outputs/apk/debug/benchmark-debug.apk
          if-no-files-found: error
